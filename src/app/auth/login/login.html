<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <table>
        <tr>
            <td><mat-form-field>
            <mat-label>Correo</mat-label>
            <input matInput placeholder="admin@example.com" formControlName="email" (blur)="updateErrorMessage()"
                required />
            @if (email?.invalid) {
            <mat-error>{{errorMessage()}}</mat-error>
            }
        </mat-form-field></td>
        </tr>
        <tr>
            <td><mat-form-field>
            <mat-label>Enter your password</mat-label>
            <input matInput [type]="hide() ? 'password' : 'text'" formControlName="password" required />
            <button matIconButton matSuffix (click)="clickEvent($event)" [attr.aria-label]="'Hide password'"
                [attr.aria-pressed]="hide()">
                <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
        </mat-form-field></td>
        </tr>
        <tr>
            <td>
                <button matButton="elevated">Iniciar Sesion</button>
            </td>
        </tr>
    </table>
</form>
