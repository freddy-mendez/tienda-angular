<h2 mat-dialog-title>Editar Nuevo Producto</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="formulario">
    <br>
    <mat-form-field appearance="outline">
      <mat-label>Nombre del producto</mat-label>
      <input matInput formControlName="nombre_producto" placeholder="Ej. Teclado">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Descripción del producto</mat-label>
      <textarea matInput formControlName="descripcion" placeholder="Marca Logitech Teclado"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Stock </mat-label>
      <input matInput type="number" formControlName="stock" placeholder="1">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Porcentaje de Iva</mat-label>
      <mat-select formControlName="iva_porcentaje">
        <mat-option value="8.00">8%</mat-option>
        <mat-option value="12.00">12%</mat-option>
        <mat-option value="16.00">16%</mat-option>
        <mat-option value="19.00">19%</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Precio Unitario</mat-label>
      <input matInput type="number" formControlName="precio_unitario" placeholder="0">
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button color="primary" [disabled]="form.invalid" (click)="guardar()">
    Guardar
  </button>
  <button mat-button (click)="cancelar()">Cancelar</button>
</mat-dialog-actions>
